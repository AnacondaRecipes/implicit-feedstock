{% set name = "implicit" %}
{% set version = "0.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bacf79120c87ad0744a4365a089409fddd33231880aef4a495bab2d4f888291d

build:
  number: 0
  script_env:
    - CMAKE_GENERATOR=Ninja
  script: python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    # cmake >=4 is not supported
    - cmake >=3.18,<4
    - ninja-base
  host:
    - pip
    - python
    - wheel
    - setuptools >=42
    - cython >=0.24
    - scikit-build >=0.13.1
    - scipy >=0.16
    - numpy {{ numpy }}
  run:
    - python
    - numpy >=1.17.0
    - scipy >=0.16
    - tqdm >=4.27
    - threadpoolctl

test:
  imports:
    - implicit
    - implicit.cpu._als
  commands:
    - python -c "import implicit; print(implicit.__version__)"

about:
  home: http://github.com/benfred/implicit
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast Python Collaborative Filtering for Implicit Datasets.
  doc_url: http://implicit.readthedocs.io
  dev_url: http://github.com/benfred/implicit


extra:
  recipe-maintainers:
    - rth
    - benfred